<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facilitator sign in — SessionSignal</title><link rel="stylesheet" href="/apps/web/src/styles/site.css"></head><body><div data-site-header></div><main id="main-content" class="auth-shell"><section class="auth-story"><span class="eyebrow">Facilitator portal</span><h1>Return to your live session.</h1><p class="page-lead">Facilitator access is provisioned by the project owner. There is no browser-side role selector or automatic privileged registration.</p></section><section class="auth-panel"><div class="auth-card"><h2>Sign in</h2><p class="muted">Use your approved SessionSignal facilitator account.</p><form id="teacherLoginForm"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8"></div><div id="loginNotice" class="form-notice" hidden role="status" aria-live="polite"></div><button class="button" type="submit">Sign in securely</button></form><p><a href="/contact">Need access or support?</a></p></div></section></main><script type="module" src="/apps/web/src/marketing/site.js"></script><script type="module" src="/apps/web/src/auth/login.js"></script></body></html>
