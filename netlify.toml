# Default Netlify build focuses on the Control Hub landing page.
[build]
  command = "npm run build:hub"
  publish = "dist/hub"

[build.environment]
  NODE_VERSION = "20"

# Branch-specific contexts allow you to wire independent Netlify sites
# (e.g. connect the student site to the `student` branch).
[context.student]
  command = "npm run build:student"
  publish = "dist/student"

[context.teacher]
  command = "npm run build:teacher"
  publish = "dist/teacher"
